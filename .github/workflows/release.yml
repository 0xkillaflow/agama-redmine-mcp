name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # create the "Version Packages" PR / tags
  pull-requests: write # open/update that PR
  id-token: write # npm provenance (OIDC)

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >=11.5.1 (Trusted Publishing/OIDC support)
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Build & test
        run: |
          npm run build
          npm test

      # When changesets exist, opens/updates a "Version Packages" PR.
      # When that PR is merged (versions bumped, no changesets left), publishes to npm.
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN: publish auth comes from OIDC via Trusted Publishing.
