paths: {}
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    ApiKeyInQueryAuth:
      type: apiKey
      in: query
      name: key
  parameters:
    format:
      name: format
      in: path
      required: true
      schema:
        type: string
        enum:
        - json
        - xml
    offset:
      name: offset
      in: query
      schema:
        type: integer
    limit:
      name: limit
      in: query
      schema:
        type: integer
    nometa:
      name: nometa
      in: query
      schema:
        type: integer
        enum:
        - 1
    x_redmine_switch_user:
      name: X-Redmine-Switch-User
      in: header
      schema:
        type: string
        example: jsmith
    x_redmine_nometa:
      name: X-Redmine-Nometa
      in: header
      schema:
        type: integer
        enum:
        - 1
    issue_id:
      name: issue_id
      in: path
      required: true
      schema:
        type: integer
    user_id:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
    project_id:
      name: project_id
      in: path
      required: true
      schema:
        type: integer
    membership_id:
      name: membership_id
      in: path
      required: true
      schema:
        type: integer
    time_entry_id:
      name: time_entry_id
      in: path
      required: true
      schema:
        type: integer
    news_id:
      name: news_id
      in: path
      required: true
      schema:
        type: integer
    issue_relation_id:
      name: issue_relation_id
      in: path
      required: true
      schema:
        type: integer
    version_id:
      name: version_id
      in: path
      required: true
      schema:
        type: integer
    wiki_page_title:
      name: wiki_page_title
      in: path
      required: true
      schema:
        type: string
    attachment_id:
      name: attachment_id
      in: path
      required: true
      schema:
        type: number
    filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
    issue_category_id:
      name: issue_category_id
      in: path
      required: true
      schema:
        type: integer
    role_id:
      name: role_id
      in: path
      required: true
      schema:
        type: integer
    group_id:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
    journal_id:
      name: journal_id
      in: path
      required: true
      schema:
        type: integer
    repository_id:
      name: repository_id
      in: path
      required: true
      schema:
        type: integer
    revision:
      name: revision
      in: path
      required: true
      schema:
        type: string
  schemas:
    id_name:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
    issue_status:
      type: object
      required:
      - id
      - name
      - is_closed
      properties:
        id:
          type: integer
        name:
          type: string
        is_closed:
          type: boolean
    custom_field_value:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
        multiple:
          type: boolean
      additionalProperties:
        description: 'value: string? | string[]'
      example:
        id: 0
        name: string
        value: string
    custom_fields:
      type: array
      items:
        type: object
        required:
        - id
        properties:
          id:
            type: number
        additionalProperties:
          description: 'value: string? | string[]'
        example:
          id: 0
          value: string
    custom_field_values:
      type: object
      additionalProperties:
        description: 'value: string? | string[]'
      example:
        '0': string
    errors:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            type: string
    attachment:
      type: object
      required:
      - id
      - filename
      - filesize
      - content_type
      - description
      - content_url
      - author
      - created_on
      properties:
        id:
          type: integer
        filename:
          type: string
        filesize:
          type: integer
        content_type:
          type: string
        description:
          type: string
        content_url:
          type: string
        thumbnail_url:
          type: string
        author:
          $ref: '#/components/schemas/id_name'
        created_on:
          type: string
          format: data-time
    role:
      type: object
      required:
      - id
      - name
      - assignable
      - issue_visibility
      - time_entries_visibility
      - users_visibility
      - permissions
      properties:
        id:
          type: integer
        name:
          type: string
        assignable:
          type: boolean
        issues_visibility:
          type: string
        time_entries_visibility:
          type: string
        users_visibility:
          type: string
        permissions:
          type: array
          items:
            type: string
