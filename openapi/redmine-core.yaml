openapi: 3.0.3
info:
  title: Redmine API - Core Components
  description: Shared components (security schemes, common parameters, and schemas referenced by more
    than one domain module) for the modularized Redmine OpenAPI specification. Domain files such as redmine-issues.yaml,
    redmine-projects.yaml, etc. reference this file via relative $ref (e.g. ./redmine-core.yaml#/components/parameters/format).
  contact:
    name: d-yoshi/redmine-openapi
    url: https://github.com/d-yoshi/redmine-openapi
  license:
    name: MIT
    url: https://github.com/d-yoshi/redmine-openapi/blob/main/LICENSE
  version: 0.16.0
servers:
- url: /
security:
- BasicAuth: []
- ApiKeyAuth: []
- ApiKeyInQueryAuth: []
