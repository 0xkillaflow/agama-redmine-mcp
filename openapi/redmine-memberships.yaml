openapi: 3.0.3
info:
  title: Redmine API - Project Memberships
  description: 'Part of the modularized Redmine OpenAPI specification. Covers: Project Memberships. Depends
    on ./redmine-core.yaml for shared parameters, security schemes, and common schemas.'
  contact:
    name: d-yoshi/redmine-openapi
    url: https://github.com/d-yoshi/redmine-openapi
  license:
    name: MIT
    url: https://github.com/d-yoshi/redmine-openapi/blob/main/LICENSE
  version: 0.16.0
servers:
- url: /
security:
- BasicAuth: []
- ApiKeyAuth: []
- ApiKeyInQueryAuth: []
tags:
- name: Project Memberships
  description: 'Status: Alpha, Availablity: 1.4'
  externalDocs:
    url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships
paths:
  /memberships/{membership_id}.json:
    get:
      tags:
      - Project Memberships
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#GET-2
      summary: Show membership
      operationId: getMembership
      parameters:
      - $ref: ./redmine-core.yaml#/components/parameters/format
      - $ref: ./redmine-core.yaml#/components/parameters/membership_id
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_switch_user
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - membership
                properties:
                  membership:
                    $ref: '#/components/schemas/membership'
    put:
      tags:
      - Project Memberships
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#PUT
      summary: Update membership
      operationId: updateMembership
      parameters:
      - $ref: ./redmine-core.yaml#/components/parameters/format
      - $ref: ./redmine-core.yaml#/components/parameters/membership_id
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_switch_user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                membership:
                  type: object
                  required:
                  - role_ids
                  properties:
                    role_ids:
                      type: array
                      items:
                        type: integer
      responses:
        '204':
          description: ''
        '422':
          description: ''
          content:
            application/json:
              schema:
                $ref: ./redmine-core.yaml#/components/schemas/errors
    delete:
      tags:
      - Project Memberships
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#DELETE
      summary: Delete membership
      operationId: deleteMembership
      parameters:
      - $ref: ./redmine-core.yaml#/components/parameters/format
      - $ref: ./redmine-core.yaml#/components/parameters/membership_id
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_switch_user
      responses:
        '204':
          description: ''
  /projects/{project_id}/memberships.json:
    get:
      tags:
      - Project Memberships
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#GET
      summary: List memberships
      operationId: getMemberships
      parameters:
      - $ref: ./redmine-core.yaml#/components/parameters/format
      - $ref: ./redmine-core.yaml#/components/parameters/project_id
      - $ref: ./redmine-core.yaml#/components/parameters/offset
      - $ref: ./redmine-core.yaml#/components/parameters/limit
      - $ref: ./redmine-core.yaml#/components/parameters/nometa
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_switch_user
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_nometa
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - memberships
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/membership'
                  total_count:
                    type: integer
                  offset:
                    type: integer
                  limit:
                    type: integer
    post:
      tags:
      - Project Memberships
      externalDocs:
        url: https://www.redmine.org/projects/redmine/wiki/Rest_Memberships#POST
      summary: Create membership
      operationId: createMembership
      parameters:
      - $ref: ./redmine-core.yaml#/components/parameters/format
      - $ref: ./redmine-core.yaml#/components/parameters/project_id
      - $ref: ./redmine-core.yaml#/components/parameters/x_redmine_switch_user
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - membership
              properties:
                membership:
                  type: object
                  required:
                  - user_id
                  - role_ids
                  properties:
                    user_id:
                      type: integer
                    role_ids:
                      type: array
                      items:
                        type: integer
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                required:
                - membership
                properties:
                  membership:
                    $ref: '#/components/schemas/membership'
components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Redmine-API-Key
    ApiKeyInQueryAuth:
      type: apiKey
      in: query
      name: key
  schemas:
    membership:
      type: object
      required:
      - id
      - project
      - roles
      properties:
        id:
          type: integer
        project:
          $ref: ./redmine-core.yaml#/components/schemas/id_name
        user:
          $ref: ./redmine-core.yaml#/components/schemas/id_name
        group:
          $ref: ./redmine-core.yaml#/components/schemas/id_name
        roles:
          type: array
          items:
            $ref: ./redmine-core.yaml#/components/schemas/id_name
